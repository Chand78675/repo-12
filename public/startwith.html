<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script>
        function VerifyCard(){
            var Card = document.getElementById("textCard").value;
            var imgCard = document.getElementById("imgCard");
            if(Card.startsWith("4555")){
            imgCard.src="../public/images/visa-card.jpg";
            }
            else{
             imgCard.src="../public/images/Master.jpg";  
            }
        }
        function VerifySkype(){
            var Skype = document.getElementById("txtSkype").value;
            var lblSkype = document.getElementById("lblSkype");
            if(Skype.endsWith("Skype.com")){
                lblSkype.innerHTML="";
            }
            else{
                lblSkype.innerHTML="invalid".fontcolor('red');
            }
        }
    </script>
</head>
<body class="container-fluid">
    <dl class="m-4 w-25">
        <dt> Your Name </dt>
        <dd class="input-group"> <input maxlength="16" onblur="VerifyCard()" type="text" class="form-control" id="textCard"><img id="imgCard" width="80" height="40" class="input-group-text"></dd>
        <dt class="bi bi-skype">Your Skype Id</dt>
        <dd><input type="text" onblur="VerifySkype()" id="txtSkype" class="form-control"></dd>
        <dd id="lblSkype"></dd>
    </dl>
</body>
</html>
