<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var fact=1;
        function factroil(n)
        {
            for(var i=1;i<=n;i++){
                fact*=i;
            }
            document.write(`Factroil number ${n} is: ${fact}`)
        }
        factroil(parseInt(prompt("Enter your Number")))
    </script>
</body>
</html>
