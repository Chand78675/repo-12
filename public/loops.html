<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function MultiplicationTables(n)
        {
            for(var i=1;i<=10;i++)
        {
            document.write(`${n} X ${i}=${n*i}<br>`)
        }
        }
        MultiplicationTables(parseInt(prompt("Enter your number")))
    </script>
</body>
</html>
