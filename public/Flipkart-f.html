<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart</title>
    <style>
        footer{
            background-color:black;
            color: white;
            font-size: 20px;
            padding: 10px;
            display:grid;
            grid-template-columns: 6fr 6fr;
            height:300px;
        }
        .left-panel{
            display: grid;
            grid-template-columns: 3fr 3fr 3fr 3fr;
        }
        .right-panel{
            display:grid;
            grid-template-columns: 6fr 6fr;
            border-left: 1px solid white;
            padding-left: 21px;
        }
    </style>
</head>
<body>
    <footer>
        <div class="left-panel">
        <div>col-1</div>
        <div>col-2</div>
        <div>col-3</div>
        <div>col-4</div>
        </div>
        <div class="right-panel">
        <div>col1</div>
        <div>col2</div>
        </div>
    </footer>   
</body>
</html>
