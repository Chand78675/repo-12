<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function PrintPattern(n)
        {
            for(var i=1;i<=n;i++)
        {
            for(var j=1;j<=i;j++)
        {
            document.write(`*&nbsp;&nbsp;`);
        }
        document.write("<br>");
        }
        }
        PrintPattern(parseInt(prompt("enter Your number")));
    </script>
</body>
</html>
