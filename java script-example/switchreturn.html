<script>
    function f1(){
        var n = parseInt(prompt("Enter your number"));
        switch(n){
            case 1:
            document.write("one");
            break;
            case 2:
            document.write("Two");
            return;
            case 3:
            document.write("three");
            break;
            case 4:
            document.write("four");
            break;
        }
    }
    f1();
</script>
