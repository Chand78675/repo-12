<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function verifyName(){
            var username = document.getElementById("textName").value;
            var lblName = document.getElementById("lblName");
           
            if(username=="john"){
            lblName.innerHTML = "User Name Taken - Try Another".fontcolor('red').fontsize(2);
            }
          else{ 
            lblName.innerHTML = "User Name Available".fontcolor("green").fontsize(2) .bold().italic();
            }
        }
        function ChangeCase(){
         var code = document.getElementById("textCode").value;
         document.getElementById("textCode").value = code.toUpperCase();
        }
    </script>
</head>
<body>
    <dl>
        <dt>User Name</dt>
        <dd><input type="text" onkeyup="verifyName()" id="textName"></dd>
        <dd id="lblName"></dd>
        <dt>Bank IFSC Code</dt>
        <dd><input type="text" id="textCode" onblur="ChangeCase()"></dd>
    </dl>
</body>
</html>
