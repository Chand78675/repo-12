<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function BodyLoad(){
            var btn = document.createElement("button");
            btn.textContent="insert";
            btn.addEventListener("click",()=>{
            document.write("Record inserted..");
            })
            document.getElementById("continer").appendChild(btn);
            document.getElementById("DeleteClick").addEventListener("click",()=>{
            document.write(" Delete");
            })
        }
    </script>
</head>
<body onload="BodyLoad()">
    <div id="continer">
        <button id="DeleteClick">Delete</button>
    </div>
</body>
</html>
