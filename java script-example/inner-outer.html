<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function DeleteClick(){
            result = confirm("Delete Record\nAre you sure? Want to Deleted?");
            if(result==true){
                document.querySelector("p").outerHTML = "<h2> Deleted Successfully..</h2>";
            }
            else{
                document.querySelector("p").innerHTML = "<h2> Canceled Deleted</h2>";
            }

        }
    </script>
</head>
<body>
    <button onclick="DeleteClick()">Delete</button>
    <p></p>
</body>
</html>
