<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #ff4757; font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.5rem; color: #2f3542; }
        
        .cake { font-size: 100px; cursor: pointer; transition: transform 0.3s; }
        .cake:hover { transform: scale(1.2) rotate(5deg); }

        .btn {
            background-color: #ff4757;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }
        .btn:hover { background-color: #ff6b81; }

        /* Confetti Animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            top: -10px;
            z-index: -1;
        }
    </style>
</head>
<body onload="checkName()">

    <h1 id="wish">Happy Birthday!</h1>
    <p id="message">Have a wonderful year ahead!</p>
    
    <div class="cake" onclick="startParty()">🎂</div>
    <br>
    <button class="btn" onclick="startParty()">Celebrate Now! 🎉</button>

    <script>
        // आपके पिछले ज्ञान का इस्तेमाल: URL से नाम पढ़ना
        function checkName() {
            const params = new URLSearchParams(window.location.search)?name=chand
            const name = params.get('name');
            if (name) {
                document.getElementById('wish').innerText = "Happy Birthday, " + name + "!";
            }
        }

        function startParty() {
            // 1. Alert Message
            alert("🎈 Party Started! 🎈");

            // 2. Create Confetti (रंगीन कागज़ गिरना)
            for (let i = 0; i < 50; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
            
            document.body.appendChild(confetti);

            // Animation logic using simple style
            let top = -10;
            let interval = setInterval(() => {
                top += 5;
                confetti.style.top = top + "px";
                if (top > window.innerHeight) {
                    clearInterval(interval);
                    confetti.remove();
                }
            }, 20);
        }
    </script>
</body>
</html>
