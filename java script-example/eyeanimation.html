<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Eyes</title>
    <style>
        body {
            /* thise css use for eye Center & all background black*/
            margin: 0;
            background: black;    /* all page background black*/
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            gap: 5vw;
        }
        .eye {
            /* thise css use for white eye part & round in mouse move*/
            width: 20vw;
            height: 20vw;
            max-width: 150px;
            max-height: 150px;
            min-width: 80px;
            min-height: 80px;
            background: white;  /*eye background white */
            border-radius: 50%;  /*thise is use for eye round*/
            position: relative;  /*thise is use for mouse move then eye also move*/
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pupil {
            /* thise is use for java script place change*/
            width: 35%;
            height: 35%;
            background: black;
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
    </div>
    <script>
        const pupils = document.querySelectorAll(".pupil"); /*it is use for both are black pupils store in list array */
        document.addEventListener("mousemove", (e) => { moveEyes(e); }); /*When mouse move then run*/
        document.addEventListener("touchmove", (e) => { moveEyes(e.touches); }); /* e is a possition (x,y) of mouse And Touch Screen */
        function moveEyes(e) {
            pupils.forEach(pupil => { /*thise funtictio every pupil given by step repeat*/
                const rect = pupil.parentElement.getBoundingClientRect(); /*rect thise is use for part of white eye location & size coming out */
                const eyeX = rect.left + rect.width / 2; /*eyex & eyey comming out center point*/
                const eyeY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX); /*Math.atan2 is prediction where is eye direction*/
                const moveX = Math.cos(angle) * (rect.width / 4); /*Math.cos & Math.sin this use only inside of circle,react.width/4 thise is decide for eye pupils not outside */
                const moveY = Math.sin(angle) * (rect.height / 4);
                pupil.style.transform = `translate(${moveX}px, ${moveY}px)`; /* thise is use for pupils for mouse driction to translate,as like eye see the mouse;*/
            });
        }
    </script>
</body>
</html>
