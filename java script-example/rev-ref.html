<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Bodyload(){
        pic.src="../public/images/kids.jpg"
        frmLogin.btnLogin.value="Login";
        frmRegister.btnRegister.value="Register";
        }
    </script>
</head>
<body onload="Bodyload()">
    <div>
        <img width="100" height="100" name="pic">
    </div>
    <div>
        <form name="frmLogin">
            <h2> User Login</h2>
            <input type="text" name="textName" placeholder="Enter user Name">
            <input type="password" name="pwd" placeholder="Enter your password">
            <input type="button" name="btnLogin">
        </form>
    </div>
    <div>
        <form name="frmRegister">
           <h2>Register</h2> 
           <input type="email" name="userEmail" placeholder="Enter your email">
           <input type="button" name="btnRegister">
        </form>
    </div>
</body>
</html>
